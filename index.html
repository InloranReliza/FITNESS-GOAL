<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Habit Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        /* --- Login Overlay Styles --- */
        #authOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .auth-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            width: 300px;
        }
        .auth-box input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto 10px auto;
        }

        .add-task-area {
            display: flex;
            margin-bottom: 20px;
        }
        #taskInput {
            flex: 1;
            padding: 10px;
            font-size: 16px;
        }
        .primary-btn {
            padding: 10px 15px;
            background-color: #009dff;
            color: white;
            border: none;
            cursor: pointer;
            margin-left: 10px;
            border-radius: 4px;
        }
        .logout-btn {
            background-color: #dc3545;
        }
        .primary-btn:hover { opacity: 0.8; }

        ul { list-style-type: none; padding: 0; }
        .habit {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .habit.done .task-text {
            text-decoration: line-through;
            color: gray;
        }
        #progressBar {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 16px;
        }
        #progressFill {
            height: 20px;
            width: 0%;
            background-color: #28a745;
            transition: width 0.3s ease-in-out;
        }
        .center { text-align: center; margin-top: 10px; }
        
        /* Hidden by default until login */
        #mainContent { display: none; }
    </style>
</head>
<body>

    <!-- 1. AUTHENTICATION OVERLAY-->
    <div id="authOverlay">
        <div class="auth-box">
            <h2>Welcome</h2>
            <p>Please enter a username to start</p>
            <input type="text" id="usernameInput" placeholder="Username...">
            <button class="primary-btn" style="margin-left:0; width:100%" onclick="login()">Login / Sign Up</button>
        </div>
    </div>

    <!-- 2. MAIN CONTENT (Hidden until login) -->
    <div id="mainContent">
        <div class="header-bar">
            <span>Logged in as: <strong id="currentUserDisplay"></strong></span>
            <button class="primary-btn logout-btn" onclick="logout()">Logout</button>
        </div>

        <h1>About Us 👩🏻👩🏽</h1>
        <div style="text-align: center; max-width: 600px; margin: auto;">
            <p> Reliza Mae C.Inloran , Aiza P. Janlay</p>
            <!-- Note: Ensure sparkletrio.jpg is in the same folder -->
           
        </div>

        <h1>Daily Health Habit Tracker ☄️</h1>

        <div class="container">
            <div class="add-task-area">
                <input type="text" id="taskInput" placeholder="Add a new habit..." />
                <button class="primary-btn" onclick="addTask()">Add</button>
            </div>

            <ul id="taskList"></ul>

            <div id="progressBar"><div id="progressFill"></div></div>

            <div class="center">
                <b>Progress:</b> <span id="progressText">0%</span><br>
                <b>Streak:</b> <span id="streak">0</span> days
            </div>

            <button class="primary-btn" style="width:100%; margin: 20px 0 0 0;" onclick="finishDay()">Finish Day & Reset</button>
        </div>
    </div>

<script>
    // --- State Management ---
    let currentUser = null;
    let tasksData = [];
    let streak = 0;

    const initialHabits = [
        "Drink 8 glasses of water 🥛",
        "Sleep 8 hours 🌙🛏️💤",
        "Eat fruits/vegetables 🍎🥦",
        "10 minutes of exercise 🏋🏽🔥💪🏼🎧"
    ];

    // Check for existing session on page load
    window.onload = () => {
        const session = localStorage.getItem("activeUser");
        if (session) {
            loadUserData(session);
        }
    };

    // --- Auth Functions ---

    function login() {
        const user = document.getElementById("usernameInput").value.trim();
        if (!user) return alert("Please enter a username");

        localStorage.setItem("activeUser", user);
        loadUserData(user);
    }

    function logout() {
        localStorage.removeItem("activeUser");
        location.reload(); // Refresh the page to reset state
    }

    function loadUserData(username) {
        currentUser = username;
        
        // Hide login, show app
        document.getElementById("authOverlay").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
        document.getElementById("currentUserDisplay").textContent = username;

        // Load user-specific data
       
        fetch(`api.php?username=${username}`)
    .then(response => response.json())
    .then(data => {

        if (data.length > 0) {

            tasksData = data.map(item => ({
                text: item.task_text,
                done: item.is_done == 1
            }));

        } else {

            tasksData = initialHabits.map(text => ({
                text,
                done: false
            }));

        }

        renderTasks();
        updateProgress();
    });
        streak = localStorage.getItem(`streak_${username}`) || 0;
        
        renderTasks();
        updateProgress();
    }

    // --- App Functions ---

    function renderTasks() {
        const taskList = document.getElementById("taskList");
        taskList.innerHTML = '';
        tasksData.forEach((taskObj, index) => {
            addTaskItem(taskObj.text, taskObj.done, index);
        });
        document.getElementById("streak").textContent = streak;
    }

    function saveTasks() {
        if (currentUser) {
            localStorage.setItem(`habits_${currentUser}`, JSON.stringify(tasksData));
        }
    }

    function updateProgress() {
        const total = tasksData.length;
        const completed = tasksData.filter(t => t.done).length;
        const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
        document.getElementById("progressFill").style.width = percent + "%";
        document.getElementById("progressText").textContent = percent + "%";
    }

    // function addTask() {
    //     const input = document.getElementById("taskInput");
    //     const text = input.value.trim();
    //     if (text) {
    //         tasksData.push({ text: text, done: false });
    //         input.value = "";
    //         saveTasks();
    //         renderTasks();
    //         updateProgress();
    //     }
    // }
    

    async function addTask() {

    const input = document.getElementById("taskInput");
    const text = input.value.trim();

    if (!text) return;

    const response = await fetch("api.php", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            username: currentUser,
            task_text: text,
            is_done: 0
        })
    });

    
    const data = await response.json();

    alert(data.message);

    tasksData.push({
        text: text,
        done: false
    });

    input.value = "";

    renderTasks();
    updateProgress();
    }
   

    function addTaskItem(taskText, isDone, index) {
        const li = document.createElement("li");
        li.className = "habit" + (isDone ? " done" : "");
        
        li.innerHTML = `
            <div class="task-content">
                <input type="checkbox" ${isDone ? "checked disabled" : ""} onchange="toggleTask(${index})">
                <span class="task-text">${taskText}</span>
            </div>
            <div class="task-buttons">
                <button onclick="editTask(${index})" ${isDone ? "disabled" : ""}>Edit</button>
                <button onclick="deleteTask(${index})">Delete</button>
            </div>
        `;
        document.getElementById("taskList").appendChild(li);
    }

    function toggleTask(index) {
        tasksData[index].done = !tasksData[index].done;
        saveTasks();
        renderTasks();
        updateProgress();
    }

    function deleteTask(index) {
        if (confirm("Delete this habit?")) {
            tasksData.splice(index, 1);
            saveTasks();
            renderTasks();
            updateProgress();
        }
    }

    function editTask(index) {
        const newText = prompt("Edit habit:", tasksData[index].text);
        if (newText) {
            tasksData[index].text = newText;
            saveTasks();
            renderTasks();
        }
    }

    function finishDay() {
        const total = tasksData.length;
        const completed = tasksData.filter(t => t.done).length;
        
        if (completed === total && total > 0) {
            streak++;
            alert(`Great job! Daily streak: ${streak}`);
        } else {
            streak = 0;
            alert("Streak reset. Complete all habits tomorrow!");
        }

        localStorage.setItem(`streak_${currentUser}`, streak);
        tasksData = tasksData.map(t => ({ ...t, done: false }));
        saveTasks();
        renderTasks();
        updateProgress();
    }
</script>

</body>
</html>
